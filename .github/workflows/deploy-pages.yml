name: Deploy Expo Web to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Build uploads an artifact; deploy downloads it — both need `actions` on GITHUB_TOKEN.
permissions:
  contents: read
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: aslApp334/package-lock.json

      - name: Install dependencies
        working-directory: aslApp334
        run: npm ci

      - name: Build web export
        working-directory: aslApp334
        run: npx expo export --platform web --output-dir dist

      - name: Add SPA fallback for Pages routes
        working-directory: aslApp334
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-dist
          path: aslApp334/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: expo-web-dist
          path: dist-site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
